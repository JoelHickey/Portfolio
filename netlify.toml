[build]
  command = "npm run build"
  publish = "dist"

# Health app (bundled at /health/) - serve static files, no redirect
# /health and /health/ serve the health app's index.html
[[redirects]]
  from = "/health"
  to = "/health/index.html"
  status = 200

[[redirects]]
  from = "/health/"
  to = "/health/index.html"
  status = 200

# Portfolio SPA - explicit routes only (so /health/* is NOT caught)
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/index.html"
  status = 200
