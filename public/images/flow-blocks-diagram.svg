<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="flow-title">
  <title id="flow-title">Create ? Store ? Ship: Macbook, Cloud, Visitor</title>
  <defs>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>
  <!-- Flow line -->
  <path d="M 80 40 C 200 40, 200 100, 320 100 C 440 100, 440 160, 560 160" fill="none" stroke="url(#line-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" opacity="0.6" />
  <!-- Block 1: Macbook -->
  <rect x="16" y="8" width="128" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="36" y="28" width="48" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="60" y="44" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Create</text>
  <text x="116" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="end">Macbook</text>
  <!-- Block 2: Cloud -->
  <rect x="256" y="68" width="128" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="296" y="88" width="48" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="320" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Store</text>
  <text x="356" y="104" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="end">Cloud</text>
  <!-- Block 3: Visitor -->
  <rect x="496" y="128" width="128" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <rect x="516" y="148" width="48" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="540" y="164" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Ship</text>
  <text x="596" y="164" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="end">Visitor</text>
</svg>
