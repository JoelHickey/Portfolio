<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="214" y1="34" x2="1382" y2="862" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07101C"/>
      <stop offset="0.48" stop-color="#0A1224"/>
      <stop offset="1" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accent" x1="290" y1="184" x2="1296" y2="694" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.24" stop-color="#2DD4BF"/>
      <stop offset="0.57" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 316) rotate(32) scale(360 256)">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1004 352) rotate(64) scale(410 280)">
      <stop stop-color="#A78BFA" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="white" stop-opacity="0.34"/>
      <stop offset="1" stop-color="white" stop-opacity="0.05"/>
