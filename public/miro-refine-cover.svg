  <rect x="178" y="146" width="390" height="604" rx="30" fill="#0C172D" fill-opacity="0.76" stroke="url(#glassStroke)" stroke-opacity="0.48"/>
  <text x="214" y="220" fill="#E2E8F0" font-size="74" font-family="Inter, Arial, sans-serif" font-weight="700">Refine</text>
  <text x="214" y="272" fill="#94A3B8" font-size="28" font-family="Inter, Arial, sans-serif">Choose the strongest direction and make it clearer.</text>

  <rect x="214" y="316" width="132" height="8" rx="4" fill="url(#accent)"/>
  <text x="214" y="388" fill="#67E8F9" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Clarify</text>
  <text x="214" y="424" fill="#CBD5E1" font-size="20" font-family="Inter, Arial, sans-serif">Goal, context, pain point</text>
  <text x="214" y="482" fill="#2DD4BF" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Select</text>
  <text x="214" y="518" fill="#CBD5E1" font-size="20" font-family="Inter, Arial, sans-serif">Keep what matters, remove noise</text>
  <text x="214" y="576" fill="#A78BFA" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="600">Sharpen</text>
  <text x="214" y="612" fill="#CBD5E1" font-size="20" font-family="Inter, Arial, sans-serif">Turn the idea into a coherent flow or artifact</text>

