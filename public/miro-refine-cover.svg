  <text x="1062" y="548" fill="#E2E8F0" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">Clearer. Stronger. Easier to read.</text>

  <path d="M1030 636H1348" stroke="url(#accent)" stroke-opacity="0.34" stroke-width="2"/>
  <text x="1036" y="678" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">Refinement is selection plus clarity.</text>
