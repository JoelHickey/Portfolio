    <path d="M726 214C800 290 878 390 982 468C1098 554 1224 602 1360 624" stroke="#C084FC" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="9 16" stroke-linecap="round"/>
    <circle cx="726" cy="214" r="16" fill="#0F1B34" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="998" cy="332" r="14" fill="#10152B" stroke="#2DD4BF" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="1332" cy="514" r="18" fill="#10152B" stroke="#E879F9" stroke-opacity="0.62" stroke-width="2"/>
  </g>

  <g>
    <rect x="784" y="152" width="180" height="108" rx="22" fill="#0F1B34" stroke="#22D3EE" stroke-opacity="0.34" transform="rotate(-8 784 152)"/>
    <rect x="1036" y="226" width="192" height="112" rx="22" fill="#10142A" stroke="#818CF8" stroke-opacity="0.34" transform="rotate(6 1036 226)"/>
    <rect x="874" y="396" width="220" height="124" rx="22" fill="#10142A" stroke="#2DD4BF" stroke-opacity="0.34" transform="rotate(-6 874 396)"/>
    <rect x="1190" y="430" width="176" height="102" rx="22" fill="#10142A" stroke="#E879F9" stroke-opacity="0.34" transform="rotate(8 1190 430)"/>
    <rect x="732" y="536" width="214" height="118" rx="22" fill="#10142A" stroke="#22D3EE" stroke-opacity="0.34" transform="rotate(5 732 536)"/>
  </g>

  <g opacity="0.9">
    <path d="M768 704H1372" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="2"/>
    <text x="780" y="694" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">Possible directions</text>
    <text x="784" y="744" fill="#E2E8F0" font-size="22" font-family="Inter, Arial, sans-serif">Diverge before you decide.</text>
