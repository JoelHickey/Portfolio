<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design System Taxonomy</title>
    <style>
      :root {
        --bg-1: #090b14;
        --bg-2: #11162a;
        --panel: rgba(14, 18, 34, 0.88);
        --text: #eef2ff;
        --muted: #a3adc2;
        --cyan: #4de3ff;
        --violet: #bb7cff;
        --emerald: #39f0b3;
        --amber: #ffbd59;
        --pink: #ff6bd6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 10% 85%, rgba(255, 107, 214, 0.12), transparent 28%),
          radial-gradient(circle at 88% 20%, rgba(77, 227, 255, 0.12), transparent 22%),
          radial-gradient(circle at 82% 86%, rgba(255, 189, 89, 0.12), transparent 24%),
          linear-gradient(160deg, var(--bg-2), var(--bg-1));
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .frame {
        width: min(1400px, 96vw);
        aspect-ratio: 16 / 9;
      }

      svg {
        width: 100%;
        height: 100%;
      }

      .title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.02em;
        fill: var(--text);
      }

      .section {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        fill: var(--text);
      }

      .subtle {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        fill: var(--muted);
      }

      .label {
        font-size: 14px;
        font-weight: 600;
        fill: var(--text);
      }

      .small {
        font-size: 12px;
        fill: var(--muted);
      }

      .node-text {
        font-size: 16px;
        font-weight: 600;
        fill: var(--text);
      }

      .pill-text {
        font-size: 12px;
        font-weight: 500;
        fill: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 1280 720" role="img" aria-label="Manual design system taxonomy diagram">
        <defs>
          <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="16" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="18" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02030a" flood-opacity="0.55" />
          </filter>

          <linearGradient id="outerStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#72efff" />
            <stop offset="52%" stop-color="#c78bff" />
            <stop offset="100%" stop-color="#47ffb9" />
          </linearGradient>
          <linearGradient id="governanceStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff7ae6" />
            <stop offset="100%" stop-color="#ba7cff" />
          </linearGradient>
          <linearGradient id="coreStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#40efff" />
            <stop offset="50%" stop-color="#3bf0b2" />
            <stop offset="100%" stop-color="#7be97f" />
          </linearGradient>
          <linearGradient id="supportStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffcc66" />
            <stop offset="100%" stop-color="#ff9e45" />
          </linearGradient>
          <linearGradient id="architectureStroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#9ef4ff" />
            <stop offset="100%" stop-color="#5ed0ff" />
          </linearGradient>
          <linearGradient id="inputStroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff7ae6" />
            <stop offset="100%" stop-color="#b37bff" />
          </linearGradient>
          <linearGradient id="outputStroke" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#65f7d0" />
            <stop offset="100%" stop-color="#89e8ff" />
          </linearGradient>

          <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c78bff" />
          </marker>
          <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#54f3bb" />
          </marker>
          <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffbe59" />
          </marker>
          <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#71ebff" />
          </marker>
        </defs>

        <rect x="0" y="0" width="1280" height="720" fill="transparent" />

        <!-- Flow ribbons -->
        <g filter="url(#glow-violet)">
          <path
            d="M 26 372
               C 78 372, 116 370, 154 358
               C 196 346, 222 338, 258 338"
            fill="none"
            stroke="url(#inputStroke)"
            stroke-width="18"
            stroke-linecap="round"
            opacity="0.52"
          />
        </g>
        <g filter="url(#glow-cyan)">
          <path
            d="M 1038 368
               C 1080 368, 1108 366, 1148 360
               C 1180 356, 1210 356, 1246 356"
            fill="none"
            stroke="url(#outputStroke)"
            stroke-width="18"
            stroke-linecap="round"
            opacity="0.52"
          />
        </g>

        <text x="46" y="346" class="small" fill="#f0b8ff">Inputs / strategy</text>
        <text x="58" y="384" class="label">Product goals</text>
        <text x="58" y="408" class="label">User needs</text>
        <text x="58" y="432" class="label">Brand goals</text>
        <text x="58" y="456" class="label">Constraints</text>

        <text x="1116" y="342" class="small" fill="#bff8ff">Outputs / products</text>
        <text x="1128" y="384" class="label">Interfaces</text>
        <text x="1128" y="408" class="label">Features</text>
        <text x="1128" y="432" class="label">Pages</text>
        <text x="1128" y="456" class="label">Experiences</text>

        <!-- Outer organic boundary -->
        <path
          d="M 238 86
             C 316 38, 446 50, 534 76
             C 626 103, 746 54, 856 66
             C 958 77, 1062 126, 1082 210
             C 1102 294, 1096 384, 1084 472
             C 1070 570, 1014 626, 926 646
             C 834 666, 722 640, 620 648
             C 500 657, 380 669, 276 632
             C 208 607, 178 548, 171 470
             C 164 390, 164 310, 170 236
             C 177 149, 188 117, 238 86 z"
          fill="rgba(14,18,34,0.9)"
          stroke="url(#outerStroke)"
          stroke-width="3"
          filter="url(#glow-violet)"
        />
        <text x="722" y="92" text-anchor="middle" class="title" transform="rotate(14 722 92)">DESIGN SYSTEM</text>

        <!-- Governance blob -->
        <path
          d="M 280 126
             C 328 102, 420 110, 470 140
             C 516 167, 526 220, 504 258
             C 477 304, 420 321, 342 304
             C 272 289, 242 248, 242 196
             C 242 160, 254 140, 280 126 z"
          fill="rgba(56,20,78,0.42)"
          stroke="url(#governanceStroke)"
          stroke-width="2.6"
          filter="url(#glow-violet)"
        />
        <text x="314" y="120" class="section">Governance</text>

        <path
          d="M 330 150
             C 356 140, 406 144, 430 164
             C 452 182, 452 214, 432 234
             C 410 257, 362 260, 336 246
             C 309 230, 298 200, 305 176
             C 309 162, 318 155, 330 150 z"
          fill="rgba(22,16,34,0.76)"
          stroke="#d97cff"
          stroke-width="2.2"
        />
        <text x="379" y="188" text-anchor="middle" class="node-text">Design</text>
        <text x="379" y="209" text-anchor="middle" class="node-text">principles</text>

        <path
          d="M 272 208
             C 290 192, 326 196, 344 214
             C 361 232, 362 269, 344 288
             C 324 308, 287 309, 267 290
             C 246 269, 248 227, 272 208 z"
          fill="rgba(22,16,34,0.76)"
          stroke="#f087ff"
          stroke-width="2.2"
        />
        <text x="304" y="246" text-anchor="middle" class="node-text">Brand</text>
        <text x="304" y="267" text-anchor="middle" class="node-text">guidelines</text>

        <!-- Core blob -->
        <path
          d="M 498 238
             C 560 196, 714 199, 798 222
             C 872 242, 916 287, 926 344
             C 934 399, 911 454, 856 492
             C 790 538, 648 555, 551 526
             C 468 500, 422 445, 420 382
             C 418 313, 440 276, 498 238 z"
          fill="rgba(6,34,28,0.5)"
          stroke="url(#coreStroke)"
          stroke-width="2.8"
          filter="url(#glow-cyan)"
        />
        <text x="650" y="180" class="section" text-anchor="middle">Core structure</text>

        <path
          d="M 544 246
             C 576 233, 632 239, 648 267
             C 661 292, 651 325, 621 338
             C 590 351, 542 344, 524 321
             C 506 298, 510 260, 544 246 z"
          fill="rgba(16,22,34,0.76)"
          stroke="#67f4d3"
          stroke-width="2.1"
        />
        <text x="585" y="294" text-anchor="middle" class="node-text">Style Guide</text>

        <path
          d="M 706 242
             C 736 228, 783 232, 803 253
             C 822 274, 821 307, 797 325
             C 774 344, 728 345, 701 329
             C 673 311, 670 265, 706 242 z"
          fill="rgba(16,22,34,0.76)"
          stroke="#79ecff"
          stroke-width="2.1"
        />
        <text x="748" y="292" text-anchor="middle" class="node-text">Tokens</text>

        <path
          d="M 526 334
             C 564 314, 632 322, 657 356
             C 676 382, 670 426, 636 444
             C 600 463, 541 455, 512 423
             C 488 397, 491 353, 526 334 z"
          fill="rgba(16,22,34,0.76)"
          stroke="#38f0b2"
          stroke-width="2.2"
        />
        <text x="582" y="388" text-anchor="middle" class="node-text">Components</text>
        <text x="582" y="410" text-anchor="middle" class="node-text">Library</text>

        <path
          d="M 430 374
             C 463 352, 520 355, 541 384
             C 558 408, 551 446, 517 464
             C 481 483, 429 477, 406 447
             C 387 422, 393 397, 430 374 z"
          fill="rgba(16,22,34,0.76)"
          stroke="#4ef2aa"
          stroke-width="2.2"
        />
        <text x="472" y="421" text-anchor="middle" class="node-text">Pattern</text>
        <text x="472" y="443" text-anchor="middle" class="node-text">Library</text>

        <!-- Architecture as cross-cutting overlay -->
        <path
          d="M 510 220
             C 598 188, 772 190, 860 228
             C 914 252, 941 292, 942 332
             C 944 375, 926 422, 886 462
             C 828 520, 654 530, 516 488"
          fill="none"
          stroke="url(#architectureStroke)"
          stroke-width="2.4"
          stroke-dasharray="8 7"
          stroke-linecap="round"
          filter="url(#glow-cyan)"
          opacity="0.9"
        />
        <text x="914" y="300" class="subtle" fill="#bdf6ff">Architecture</text>

        <path d="M 894 304 C 868 306, 848 312, 832 322" fill="none" stroke="#9ef4ff" stroke-width="1.8" marker-end="url(#arrow-cyan)" />

        <!-- Support blob -->
        <path
          d="M 702 504
             C 750 478, 874 478, 946 500
             C 1004 518, 1024 557, 1014 595
             C 1002 639, 946 655, 870 656
             C 786 656, 724 648, 684 622
             C 650 599, 649 546, 702 504 z"
          fill="rgba(64,31,3,0.42)"
          stroke="url(#supportStroke)"
          stroke-width="2.5"
          filter="url(#soft-shadow)"
        />
        <text x="812" y="488" class="section">Support</text>

        <path
          d="M 714 530
             C 734 517, 778 518, 798 530
             C 814 540, 817 566, 800 581
             C 783 595, 739 596, 717 584
             C 693 571, 692 544, 714 530 z"
          fill="rgba(26,20,14,0.76)"
          stroke="#ffc766"
          stroke-width="2"
        />
        <text x="755" y="561" text-anchor="middle" class="label">Documentation</text>

        <path
          d="M 852 525
             C 870 516, 906 517, 923 530
             C 938 542, 938 564, 922 578
             C 905 591, 870 592, 852 582
             C 833 571, 833 538, 852 525 z"
          fill="rgba(26,20,14,0.76)"
          stroke="#ffc766"
          stroke-width="2"
        />
        <text x="886" y="560" text-anchor="middle" class="label">How to</text>

        <path
          d="M 724 585
             C 744 574, 781 574, 798 588
             C 812 600, 812 624, 796 639
             C 780 653, 742 654, 724 644
             C 704 633, 703 598, 724 585 z"
          fill="rgba(26,20,14,0.76)"
          stroke="#ffc766"
          stroke-width="2"
        />
        <text x="760" y="614" text-anchor="middle" class="small" fill="#ffffff">Sample</text>
        <text x="760" y="632" text-anchor="middle" class="label">pages</text>

        <path
          d="M 842 588
             C 862 575, 903 576, 922 590
             C 938 602, 939 626, 922 640
             C 905 654, 865 655, 845 644
             C 825 633, 821 603, 842 588 z"
          fill="rgba(26,20,14,0.76)"
          stroke="#ffc766"
          stroke-width="2"
        />
        <text x="881" y="621" text-anchor="middle" class="label">Resources</text>

        <!-- Connectors -->
        <path d="M 258 338 C 280 336, 296 320, 306 290" fill="none" stroke="#c78bff" stroke-width="2.5" marker-end="url(#arrow-violet)" />
        <path d="M 500 244 C 520 260, 528 278, 530 298" fill="none" stroke="#c78bff" stroke-width="2.5" marker-end="url(#arrow-violet)" />
        <path d="M 924 368 C 972 368, 1006 366, 1060 364" fill="none" stroke="#54f3bb" stroke-width="4" marker-end="url(#arrow-emerald)" filter="url(#glow-cyan)" />
        <path d="M 782 506 C 774 481, 768 462, 754 438" fill="none" stroke="#ffbe59" stroke-width="2.5" marker-end="url(#arrow-amber)" />
      </svg>
    </div>
  </body>
  </html>
